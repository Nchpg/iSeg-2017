name: images

# Construit l'image, la contrôle (pas de root, port >= 1024) et la publie sur ghcr.io ;
# think repère la nouvelle image et la déploie quelques minutes après le push.
# Toute la logique est dans Nchpg/.dotfiles, .github/workflows/app-image.yml.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  image:
    uses: Nchpg/.dotfiles/.github/workflows/app-image.yml@main
    with:
      # Package ghcr = nom du dépôt (mis en minuscules). Plusieurs images :
      # '[{"name": "monapp-front", "dockerfile": "front/Dockerfile"}, {"name": "monapp-api", "dockerfile": "api/Dockerfile"}]'
      images: '[{"name": "${{ github.event.repository.name }}"}]'
    permissions:
      contents: read
      packages: write
