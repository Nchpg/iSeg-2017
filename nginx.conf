# Server block for the static page, dropped into the nginx-unprivileged image
# as /etc/nginx/conf.d/default.conf.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # NO cross-origin isolation headers here, unlike the other ONNX page on this
    # domain. `app.js` pins `ort.env.wasm.numThreads = 1` for exactly that
    # reason: single-threaded WASM needs no SharedArrayBuffer, so nothing has to
    # be isolated and the runtime still loads from cdnjs under plain hosting.

    location / {
        try_files $uri $uri/ =404;
    }
}
